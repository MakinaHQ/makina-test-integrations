# Gas Top Up: fixed recipient and amount, with an on-chain minimum interval between sends.
# Derived from MakinaHQ/makina-test-integrations@b943c5fe65ac370998a104f5d8b18fd98c46b0d4.
# Each call sends one fixed amount; this is a per-call amount, not a cumulative cap. A send
# reverts unless at least `min_interval` seconds have passed since the Safe's last send under
# `cooldown_key` (one key per recipient). See blueprints-x/transfer/transfer-native.yaml.
- name: unwrap_and_transfer_native_fixed_cooldown
  is_debt: false
  instruction_type: "HARVEST"
  affected_tokens: []
  instruction:
    label: ${position.label}
    path: "../../../blueprints-x/transfer/transfer-native.yaml:unwrap_and_transfer_native_fixed_cooldown"
    inputs:
      wrapped_native_address:
        type: "address"
        value: ${position.wrapped_native_address}
      unwrap_forwarder:
        type: "address"
        value: ${position.unwrap_forwarder}
      to:
        type: "address"
        value: ${position.to}
      amount:
        type: "uint256"
        value: ${position.amount}
      kv_store_address:
        type: "address"
        value: ${position.kv_store_address}
      context_helper_address:
        type: "address"
        value: ${position.context_helper_address}
      math_helper_address:
        type: "address"
        value: ${position.math_helper_address}
      boolean_helper_address:
        type: "address"
        value: ${position.boolean_helper_address}
      cooldown_key:
        type: "bytes32"
        value: ${position.cooldown_key}
      min_interval:
        type: "uint256"
        value: ${position.min_interval}
