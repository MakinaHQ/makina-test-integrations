# makina-x native-asset transfer: unwrap wrapped native and forward it, atomically.
# Management-only: no ACCOUNTING action — makina-x positions are not NAV-accounted on-chain.
#
# THE SAFE NEVER HOLDS THE NATIVE ASSET. Both calls run in one weiroll script, and the unwrap
# happens inside NativeUnwrapForwarder, not in the Safe: the Safe approves the forwarder for
# exactly `amount`, the forwarder pulls the wrapper, calls `withdraw`, and forwards the native
# asset to the recipient. The forwarder is the only transient holder, for the two opcodes
# between `withdraw` and the forward. The allowance is granted and consumed in the same
# transaction, so nothing is left standing afterwards.
#
# WHY A HELPER AND NOT A VALUE-BEARING CALL. The weiroll VM does support value calls
# (FLAG_CT_VALUECALL), but the transpiler has no surface to emit one: a blueprint call is
# {description, target, selector, parameters, return} and the command flags are hardcoded to
# CommandFlags::CALL. Every weiroll command in every rootfile in this repo is a plain CALL.
# Routing the native asset through the Safe would also mean relying on WETH9's 2300-gas
# `transfer` stipend into the Safe's `receive()`. The forwarder sidesteps both: two ordinary
# CALLs, and the recipient gets a full-gas call with empty calldata, so CEX deposit addresses
# that run logic in `receive()` work.
#
# Same `protocol: "transfer"` namespace as ./transfer.yaml — splitting the native path into its
# own file changes no generated rootfile path.
#
# ONE FORWARDER PER (CHAIN, WRAPPER). The wrapper is immutable in the forwarder's constructor,
# so `wrapped_native_address` here MUST equal the forwarder's `wrapper()`. Mismatched, the
# approve lands on the wrong token and the pull reverts. On mainnet that pair is WETH/ETH; on
# HyperEVM, wHYPE/HYPE.
#
# TWO ACTIONS, PICK BY HOW MUCH THE ROOT SHOULD FREEZE — the same split as
# ../approve/approve.yaml:
#   unwrap_and_transfer_native        recipient pinned in the leaf, amount operator-chosen
#                                     (`input_slots`), like ./transfer.yaml
#   unwrap_and_transfer_native_fixed  recipient AND amount both pinned in the leaf; no
#                                     `input_slots` at all, so the root authorizes exactly one
#                                     call and the operator supplies nothing
#
# A THIRD ACTION ADDS A MINIMUM INTERVAL BETWEEN SENDS:
#   unwrap_and_transfer_native_fixed_cooldown
#                                     as `_fixed`, and the script reverts unless at least
#                                     `min_interval` seconds have passed since this Safe's last
#                                     send under `cooldown_key`
# A HARVEST leaf has no cooldown of its own in the module, so a `_fixed` leaf can be executed
# any number of times in a row. The `_cooldown` action bounds that on-chain with six extra plain
# CALLs in front of the same approve + unwrapAndSend pair:
#   last   = store.get(cooldown_key)          0 if this Safe never sent under this key
#   now    = context.blockTimestamp()
#   next   = math.add(last, min_interval)     reverts on overflow, never wraps
#   early  = math.gt(next, now)
#   boolean.revertIfTrue(early)
#   store.set(cooldown_key, now)              written BEFORE the native asset leaves the Safe
# The script runs with the Safe as msg.sender of every call, so `kv_store_address` MUST be a
# store that files records under msg.sender (get/set keyed by caller), NOT a per-caliber store:
# the record then lives in the Safe's own namespace and no other account can write it.
# `cooldown_key` and `min_interval` are pinned in the leaf: changing either means a new root.
# Use one key per recipient so two recipients never share a timer. `min_interval` must be > 0
# and far below 2^256 (the consumer is expected to bound it; `add` reverts on overflow).
# EVERY HELPER ADDRESS MUST HAVE CODE ON THE CHAIN. `revertIfTrue` returns nothing, so a call to
# an address without code succeeds and the interval is NOT enforced: check the code of
# `kv_store_address`, `context_helper_address`, `math_helper_address` and
# `boolean_helper_address` before a root with this action is signed.
# The four `_cooldown` inputs are only read by that action; the two older actions ignore them.
protocol: "transfer"

inputs:
  wrapped_native_address:
    type: "address"
  unwrap_forwarder:
    type: "address"
  to:
    type: "address"
  amount:
    type: "uint256"
  # Only read by `unwrap_and_transfer_native_fixed_cooldown`:
  kv_store_address:
    type: "address"
  context_helper_address:
    type: "address"
  math_helper_address:
    type: "address"
  boolean_helper_address:
    type: "address"
  cooldown_key:
    type: "bytes32"
  min_interval:
    type: "uint256"

actions:
  unwrap_and_transfer_native:
    calls:
      - description: "Approve the forwarder to pull the wrapped native asset from the Safe"
        target: ${inputs.wrapped_native_address}
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.unwrap_forwarder}
          - type: "uint256"
            value: ${input_slots.amount_to_transfer}

      - description: "Unwrap and forward the native asset to the destination in one call"
        target: ${inputs.unwrap_forwarder}
        selector: "unwrapAndSend(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.to}
          - type: "uint256"
            value: ${input_slots.amount_to_transfer}
    input_slots:
      amount_to_transfer:
        type: "uint256"
        description: "The amount of wrapped native to unwrap and forward"

  # Fully static variant: `amount` comes from the blueprint inputs rather than a slot, so both
  # the recipient and the size are committed to the root at governance time and the operator
  # supplies nothing at execution time. Instantiate once per (recipient, amount) pair.
  unwrap_and_transfer_native_fixed:
    calls:
      - description: "Approve the forwarder to pull the pinned amount from the Safe"
        target: ${inputs.wrapped_native_address}
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.unwrap_forwarder}
          - type: "uint256"
            value: ${inputs.amount}

      - description: "Unwrap and forward the pinned amount of native asset to the destination"
        target: ${inputs.unwrap_forwarder}
        selector: "unwrapAndSend(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.to}
          - type: "uint256"
            value: ${inputs.amount}

  # `_fixed` with an on-chain minimum interval between sends (see the header). No `input_slots`:
  # the operator supplies nothing, and every address, the key, the interval, the recipient and
  # the amount are committed to the root.
  unwrap_and_transfer_native_fixed_cooldown:
    calls:
      - description: "Read the time of this Safe's last send from the key-value store (0 if never)"
        target: ${inputs.kv_store_address}
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: ${inputs.cooldown_key}
        return:
          name: "last_top_up_timestamp"
          type: "uint256"

      - description: "Get the current block.timestamp"
        target: ${inputs.context_helper_address}
        selector: "blockTimestamp()"
        parameters: []
        return:
          name: "current_timestamp"
          type: "uint256"

      - description: "Earliest time the next send is allowed: last send + pinned minimum interval"
        target: ${inputs.math_helper_address}
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: ${returns.last_top_up_timestamp}
          - type: "uint256"
            value: ${inputs.min_interval}
        return:
          name: "next_allowed_timestamp"
          type: "uint256"

      - description: "Is it too early? (next allowed time > current time)"
        target: ${inputs.math_helper_address}
        selector: "gt(uint256,uint256)" # gt(a, b) = a > b
        parameters:
          - type: "uint256"
            value: ${returns.next_allowed_timestamp}
          - type: "uint256"
            value: ${returns.current_timestamp}
        return:
          name: "is_too_early"
          type: "bool"

      - description: "Revert if the minimum interval has not passed"
        target: ${inputs.boolean_helper_address}
        selector: "revertIfTrue(bool)"
        parameters:
          - type: "bool"
            value: ${returns.is_too_early}

      - description: "Store the current block.timestamp as this Safe's last send"
        target: ${inputs.kv_store_address}
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: ${inputs.cooldown_key}
          - type: "uint256"
            value: ${returns.current_timestamp}

      - description: "Approve the forwarder to pull the pinned amount from the Safe"
        target: ${inputs.wrapped_native_address}
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.unwrap_forwarder}
          - type: "uint256"
            value: ${inputs.amount}

      - description: "Unwrap and forward the pinned amount of native asset to the destination"
        target: ${inputs.unwrap_forwarder}
        selector: "unwrapAndSend(address,uint256)"
        parameters:
          - type: "address"
            value: ${inputs.to}
          - type: "uint256"
            value: ${inputs.amount}
