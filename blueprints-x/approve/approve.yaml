# UNSIGNED LOCAL CANDIDATE. Nonempty token view call, ignored result, constant-zero NAV.
# This subscription-specific USDC candidate requires compiler and WALLED fork validation.
protocol: approve
inputs:
  token_address:
    type: address
  spender:
    type: address
  amount:
    type: uint256
actions:
  approve_spender:
    calls:
    - description: Approve the spender to spend the exact pinned amount of the token
      target: ${inputs.token_address}
      selector: approve(address,uint256)
      parameters:
      - type: address
        value: ${inputs.spender}
      - type: uint256
        value: ${inputs.amount}
  cancel_approval:
    calls:
    - description: Revoke the spender's allowance on the token (approve 0)
      target: ${inputs.token_address}
      selector: approve(address,uint256)
      parameters:
      - type: address
        value: ${inputs.spender}
      - type: uint256
        value: '0'
  account_approval:
    calls:
    - description: Read token decimals without assigning a result; allowance NAV remains
        constant zero
      target: ${inputs.token_address}
      selector: decimals()
      parameters: []
    reserved_slots:
    - type: uint256
      value: '0'
    - type: uint256
      value: ${builtins.UINT256_MAX}
