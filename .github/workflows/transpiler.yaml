name: Transpiler

# Rootfile Merkle roots are immutable. Existing rootfiles may only be modified
# when their transpiler-computed roots remain unchanged. New rootfiles must be
# the most recent in their directory and exactly match regenerated output.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run-transpiler:
    name: Verify rootfiles with the transpiler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed rootfiles files
        id: changed-rootfiles
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: machines/**/rootfiles/**.toml

      # Rootfiles filename format: YYYYMMDDHHMMSS-<name>.toml
      # New rootfiles should start with the most recent timestamp in the directory
      # [naive alphabetical order - not checking YYYYMMDD format]
      - name: Verify new rootfiles filename format
        if: steps.changed-rootfiles.outputs.added_files_count > 0
        env:
          ADDED_ROOTFILES: ${{ steps.changed-rootfiles.outputs.added_files }}
        run: |
          for file in ${ADDED_ROOTFILES}; do
            dir=$(cd -- "$(dirname -- "$file")" && pwd)
            base=$(basename -- "$file")

            # Get the lexicographically smallest regular file name in the directory (ascending order)
            top=$(
              cd -- "$dir"
              LC_ALL=C ls -1Ap | grep -v '/$' | LC_ALL=C sort -r | head -n 1
            )

            if [[ "$base" == "$top" ]]; then
              exit 0
            else
              echo "Error: The name of the new rootfile '$base' should start with the most recent timestamp in '$dir'. First is '$top'." >&2
              exit 1
            fi
          done

      - name: Checkout transpiler repository
        if: steps.changed-rootfiles.outputs.added_files_count > 0 || steps.changed-rootfiles.outputs.modified_files_count > 0
        uses: actions/checkout@v5
        with:
          repository: MakinaHQ/transpiler
          ref: 2df47bfa6e49887d11072ebe266c5efcee6a102a
          path: transpiler

      - name: Install Rust toolchain
        if: steps.changed-rootfiles.outputs.added_files_count > 0 || steps.changed-rootfiles.outputs.modified_files_count > 0
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        if: steps.changed-rootfiles.outputs.added_files_count > 0 || steps.changed-rootfiles.outputs.modified_files_count > 0
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: transpiler

      - name: Build transpiler
        if: steps.changed-rootfiles.outputs.added_files_count > 0 || steps.changed-rootfiles.outputs.modified_files_count > 0
        working-directory: transpiler
        run: cargo build --release

      - name: Verify existing rootfile Merkle roots are unchanged
        if: steps.changed-rootfiles.outputs.modified_files_count > 0
        working-directory: transpiler
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODIFIED_ROOTFILES: ${{ steps.changed-rootfiles.outputs.modified_files }}
        run: |
          set -euo pipefail
          for file in ${MODIFIED_ROOTFILES}; do
            base_rootfile=$(mktemp)
            trap 'rm -f "$base_rootfile"' EXIT
            git -C .. show "${BASE_SHA}:${file}" > "$base_rootfile"

            base_root=$(./target/release/transpiler root --rootfile "$base_rootfile")
            pr_root=$(./target/release/transpiler root --rootfile "../$file")

            if [[ "$base_root" != "$pr_root" ]]; then
              echo "Error: $file changed its Merkle root from $base_root to $pr_root. Existing rootfile roots are immutable." >&2
              exit 1
            fi

            rm -f "$base_rootfile"
            trap - EXIT
          done

      - name: Run transpiler
        if: steps.changed-rootfiles.outputs.added_files_count > 0
        working-directory: transpiler
        env:
          ADDED_ROOTFILES: ${{ steps.changed-rootfiles.outputs.added_files }}
        run: |
          for file in ${ADDED_ROOTFILES}; do
            caliber="../$(dirname "$(dirname "$file")")/caliber.yaml"
            new_file="../$(dirname "$file")/generated.toml"
            tokenlist="../token-lists/test-token-list.json"
            echo "Running transpiler for $caliber - to verify $file rootfile)"
            cargo run -r -- -i "$caliber" -o "$new_file" -t "$tokenlist"
            diff "../$file" "$new_file" || exit 1
            rm "$new_file"
          done
