    inputs:
      aave_token:
        type: "address"
        value: "0x24e6e0795b3c7c71D965fCc4f371803d1c1DcA1E" # variableDebtBasWETH
      account:
        type: "address"
        value: ${config.caliber_address}

- is_debt: true
